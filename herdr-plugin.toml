# herdr-plugin.toml — manifest for the review sidecar, a fork of herdr-file-viewer.
#
# The sidecar is the file viewer started in review mode (`--review`): a flat list of review items
# (`F01.md`, `Q01.md`, …) on the left, the selected item rendered on the right, refreshed as the
# directory changes. The plugin id, pane title and action id differ from herdr-file-viewer's, so
# both plugins can be installed side by side. The viewer appears ONLY in response to an explicit
# action (its keybinding) — there are no event hooks and no automatic invocation (AC-N4).
#
# Unix only: the launcher is a shell script, and Windows cannot spawn the manifest's relative pane
# command (see upstream's herdr-plugin.toml).

id = "giggs.review-sidecar"
name = "review-sidecar"
version = "1.18.0"
description = "A review sidecar: finding and grill-question files listed by status beside your work, rendered and refreshed live."
min_herdr_version = "0.7.5"
platforms = ["linux", "macos"]

# Build step herdr runs at install time: download a prebuilt binary matching this source's version
# from this fork's releases, else build from source with cargo.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

# The sidecar pane. herdr performs the split placement on launch (AC-17). The directory it shows is
# handed over by the launcher with `plugin pane open --env HERDR_FILE_VIEWER_ROOT=<dir>`.
[[panes]]
id = "review"
title = "Review"
placement = "split"
command = ["./target/release/herdr-file-viewer", "--review"]

# The action that summons the sidecar (bound to a keybinding in herdr config). Its launcher asks
# the binary (`--review-root`) for the review directory.
[[actions]]
id = "open-review-sidecar"
title = "Open review sidecar"
description = "Open the review sidecar for the current work in a split pane beside it."
command = ["bash", "scripts/open-review-sidecar.sh"]
